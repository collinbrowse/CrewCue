<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Cue Loaders</title>
<style>
  :root { --bg:#F4F2EE; --ink:#1A2238; --muted:#6B7280; --card:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0E1220; --ink:#F2EFE8; --muted:#9AA3B2; --card:#171C2E; } }
  :root[data-theme="dark"] { --bg:#0E1220; --ink:#F2EFE8; --muted:#9AA3B2; --card:#171C2E; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, sans-serif; padding:32px 16px; }
  h1 { font-size:20px; margin:0 0 4px; text-align:center; }
  p.sub { color:var(--muted); margin:0 0 28px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; max-width:1000px; margin:0 auto; }
  .card { background:var(--card); border-radius:20px; padding:20px; text-align:center; }
  .card h2 { font-size:15px; margin:14px 0 2px; }
  .card p { color:var(--muted); margin:0; font-size:13px; }
  .row { display:flex; align-items:center; justify-content:center; gap:18px; }
  svg.icon { width:150px; height:150px; border-radius:34px; }
  svg.bare { width:44px; height:44px; }
</style>
</head>
<body>
<h1>Crew Cue: icon as loader</h1>
<p class="sub">Large: the app icon animating, as on a launch screen. Small: the bare glyph as an inline spinner.</p>
<div class="grid" id="grid"></div>
<script>
const S = -45, E = -287, DOT = 45, R = 280, C = 512;
const pt = a => { const r = a * Math.PI / 180; return [C + R * Math.cos(r), C + R * Math.sin(r)]; };
const arc = (a0, a1) => { // a0 > a1, drawn with decreasing angle
  if (a0 - a1 < 0.5) return "";
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${x0} ${y0} A${R} ${R} 0 ${a0 - a1 > 180 ? 1 : 0} 0 ${x1} ${y1}`;
};
const ease = x => x < 0 ? 0 : x > 1 ? 1 : (x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2);
const clamp = x => Math.max(0, Math.min(1, x));
const LEG = 40.3, STEP = 67.3;

const variants = [
  { id:"arrival", title:"B1 · Arrival", note:"The course draws itself to the runner dot, then the tail catches up. The dot pulses on arrival.",
    bg:["#FF8A3D","#E23E2B"], stroke:"#FFF7EE", dot:"#FFF7EE", kind:"draw", period:1800 },
  { id:"legs", title:"B2 · Check-ins", note:"Each leg between aid stations lights up in turn, then the runner arrives.",
    bg:["#FF8A3D","#E23E2B"], stroke:"#FFF7EE", dot:"#FFF7EE", kind:"legs", period:2400 },
  { id:"night", title:"B3 · Arrival, night", note:"Same motion as B1. Navy background with an orange runner dot.",
    bg:["#16213A","#0C1324"], stroke:"#FFF7EE", dot:"#FF6B2C", kind:"draw", period:1800 },
];

const grid = document.getElementById("grid");
const parts = [];
for (const v of variants) {
  const card = document.createElement("div");
  card.className = "card";
  const glyph = (cls, withBg) => `
    <svg class="${cls}" viewBox="0 0 1024 1024" aria-hidden="true">
      ${withBg ? `<defs><linearGradient id="g-${v.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${v.bg[0]}"/><stop offset="1" stop-color="${v.bg[1]}"/></linearGradient></defs>
      <rect width="1024" height="1024" fill="url(#g-${v.id})"/>` : ""}
      ${[0,1,2,3].map(i => `<path class="s" fill="none" stroke="${withBg ? v.stroke : v.bg[1]}" stroke-width="96" stroke-linecap="round"/>`).join("")}
      <circle class="d" cx="${pt(DOT)[0]}" cy="${pt(DOT)[1]}" r="62" fill="${withBg ? v.dot : (v.id === "night" ? v.dot : v.bg[1])}"/>
    </svg>`;
  card.innerHTML = `<div class="row">${glyph("icon", true)}${glyph("bare", false)}</div><h2>${v.title}</h2><p>${v.note}</p>`;
  grid.appendChild(card);
  card.querySelectorAll("svg").forEach(svg => parts.push({ v, paths:[...svg.querySelectorAll(".s")], dot:svg.querySelector(".d") }));
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  for (const { v, paths, dot } of parts) {
    const t = reduce ? 0.55 : (now % v.period) / v.period;
    let scale = 1;
    if (v.kind === "draw") {
      let a0 = S, a1 = S;
      if (t < .5) a1 = S - (S - E) * ease(t / .5);
      else if (t < .62) a1 = E;
      else { a1 = E; a0 = S - (S - E) * ease((t - .62) / .38); }
      paths[0].setAttribute("d", arc(a0, a1));
      for (let i = 1; i < 4; i++) paths[i].setAttribute("d", "");
      if (t > .45 && t < .7) scale = 1 + .28 * Math.sin(Math.PI * (t - .45) / .25);
    } else {
      const fade = t > .88 ? 1 - (t - .88) / .12 : 1;
      paths.forEach((p, i) => {
        const a = S - i * STEP;
        p.setAttribute("d", arc(a, a - LEG));
        const lit = reduce ? 1 : ease(clamp((t - (.08 + i * .15)) / .1));
        p.setAttribute("opacity", (.28 + .72 * lit * fade).toFixed(3));
      });
      const pop = clamp((t - .7) / .12);
      if (!reduce && t > .7 && t < .82) scale = 1 + .3 * Math.sin(Math.PI * pop);
      dot.setAttribute("opacity", reduce ? 1 : (t < .7 ? .4 : .4 + .6 * fade).toFixed(3));
    }
    const [cx, cy] = pt(DOT);
    dot.setAttribute("transform", `translate(${cx} ${cy}) scale(${scale}) translate(${-cx} ${-cy})`);
  }
  if (!reduce) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
