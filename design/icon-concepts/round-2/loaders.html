<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Icon Concepts</title>
<style>
  :root { --bg:#F4F2EE; --ink:#1A2238; --muted:#6B7280; --card:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0E1220; --ink:#F2EFE8; --muted:#9AA3B2; --card:#171C2E; } }
  :root[data-theme="dark"] { --bg:#0E1220; --ink:#F2EFE8; --muted:#9AA3B2; --card:#171C2E; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, sans-serif; padding:32px 16px; }
  h1 { font-size:20px; margin:0 0 4px; text-align:center; }
  p.sub { color:var(--muted); margin:0 auto 28px; text-align:center; max-width:640px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border-radius:20px; padding:20px; text-align:center; }
  .card h2 { font-size:16px; margin:14px 0 0; }
  .card .idea { font-size:13px; color:var(--ink); margin:4px 0 6px; font-weight:500; }
  .card p { color:var(--muted); margin:0; font-size:13px; }
  .row { display:flex; align-items:center; justify-content:center; gap:18px; }
  svg.big { width:150px; height:150px; border-radius:34px; }
  svg.small { width:44px; height:44px; border-radius:10px; }
</style>
</head>
<body>
<h1>Round 2: five marks that move</h1>
<p class="sub">Each name is only a suggestion. Large: the app icon animating, as on a launch screen. Small: the same icon at home-screen size.</p>
<div class="grid" id="grid"></div>
<script>
const MEET_DOTS = [[555,591],[639,652],[714,723],[744,820]];
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : (x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2);
const easeOutBack = x => { x = Math.max(0, Math.min(1, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = x => Math.max(0, Math.min(1, x));
const pop = (t, a, b) => t < a ? 0 : t > b ? 1 : easeOutBack((t - a) / (b - a));
const fadeOut = (t, a) => t < a ? 1 : 1 - (t - a) / (1 - a);
const ringPt = a => { const r = a * Math.PI / 180; return [512 + 260 * Math.sin(r), 512 - 260 * Math.cos(r)]; };
const ringArc = (a0, a1) => { const [x0,y0] = ringPt(a0), [x1,y1] = ringPt(a1); return `M${x0} ${y0} A260 260 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
const scaleAt = (el, cx, cy, s) => el.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);

const concepts = [
  { id:"cairn", name:"Cairn", idea:"Stacked stones mark the trail.", note:"Cairns are how ultra courses are marked. The orange top stone is your runner. Loader: the stones drop in and stack, one at a time.",
    bg:["#34404F","#1F2833"], period:2200, still:.7,
    body:`<rect class="s0" x="282" y="640" width="460" height="150" rx="75" fill="#F3ECDD"/>
          <g class="s1"><rect x="352" y="474" width="320" height="136" rx="68" fill="#F3ECDD" transform="rotate(-4 512 542)"/></g>
          <g class="s2"><rect x="414" y="326" width="196" height="118" rx="59" fill="#FF7A3D" transform="rotate(6 512 385)"/></g>`,
    tick(svg, t) { const f = fadeOut(t, .86);
      ["s0","s1","s2"].forEach((c, i) => { const el = svg.querySelector("."+c); const p = pop(t, .05 + i*.2, .25 + i*.2);
        el.setAttribute("transform", `translate(0 ${(1 - p) * -520})`); el.setAttribute("opacity", (t < .05 + i*.2 ? 0 : f).toFixed(3)); }); } },
  { id:"meet", name:"Meetpoint", idea:"The runner's trail and the crew's road meet at the aid station.", note:"Solid line: the runner on trail. Dots: the crew driving in. Yellow: where they meet. Loader: both arrive at the same moment.",
    bg:["#4B4FE0","#2B2CA6"], period:2200, still:.75,
    body:`<path class="trail" d="M280 820 C 280 640, 512 640, 512 500" pathLength="1" fill="none" stroke="#FFFFFF" stroke-width="80" stroke-linecap="round" stroke-dasharray="1 1"/>
          ${MEET_DOTS.map(([x,y], i) => `<circle class="cd" data-i="${i}" cx="${x}" cy="${y}" r="40" fill="#FFFFFF"/>`).join("")}
          <circle class="goal" cx="512" cy="330" r="76" fill="#FFC93C"/>`,
    tick(svg, t) { const f = fadeOut(t, .86);
      const tr = svg.querySelector(".trail"); tr.setAttribute("stroke-dashoffset", 1 - ease(t / .5)); tr.setAttribute("opacity", f);
      svg.querySelectorAll(".cd").forEach(d => { const k = MEET_DOTS.length - 1 - +d.dataset.i; d.setAttribute("opacity", t > .06 + k * .12 ? f : 0); });
      const g = svg.querySelector(".goal"); scaleAt(g, 512, 330, pop(t, .5, .66)); g.setAttribute("opacity", f); } },
  { id:"switch", name:"Switchback", idea:"A trail climbing in hairpin turns to the top.", note:"The climbing line also reads as an S, so it works as a monogram for a name like Switchback. Loader: the line climbs and the summit pings.",
    bg:["#1F8A4C","#11532D"], period:2200, still:.75,
    body:`<path class="path" d="M330 692 H630 A70 70 0 0 0 630 552 H394 A70 70 0 0 1 394 412 H560" pathLength="1" fill="none" stroke="#F4F1E6" stroke-width="64" stroke-linecap="round" stroke-dasharray="1 1"/>
          <circle class="ring" cx="684" cy="412" r="58" fill="none" stroke="#FFD23F" stroke-width="14"/>
          <circle class="top" cx="684" cy="412" r="58" fill="#FFD23F"/>`,
    tick(svg, t) { const f = fadeOut(t, .88);
      const p = svg.querySelector(".path"); p.setAttribute("stroke-dashoffset", 1 - ease(t / .55)); p.setAttribute("opacity", f);
      const top = svg.querySelector(".top"); scaleAt(top, 684, 412, pop(t, .52, .68)); top.setAttribute("opacity", f);
      const r = clamp((t - .6) / .3); const ring = svg.querySelector(".ring");
      ring.setAttribute("r", 58 + 90 * r); ring.setAttribute("opacity", t < .6 ? 0 : (.8 * (1 - r)).toFixed(3)); } },
  { id:"pacer", name:"Pacer", idea:"Your runner against the planned pace.", note:"The faint ring is the plan. The bright arc shows how far ahead of pace the runner is. Loader: the runner dot surges ahead and drops back, but never stops.",
    bg:["#E8344E","#A3162F"], period:3000, still:0,
    body:`<circle cx="512" cy="512" r="260" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="64"/>
          <path class="lead" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round"/>
          <circle class="runner" r="74" fill="#FFFFFF"/>`,
    tick(svg, t) { const pace = 360 * t; const run = pace + 42 + 30 * Math.sin(4 * Math.PI * t);
      svg.querySelector(".lead").setAttribute("d", ringArc(pace, run));
      const [x, y] = ringPt(run); const r = svg.querySelector(".runner"); r.setAttribute("cx", x); r.setAttribute("cy", y); } },
  { id:"bearing", name:"Bearing", idea:"Heading forward with a breadcrumb trail behind you.", note:"The most literal navigation mark. The dots show where the runner has been. Loader: the arrow swings, settles on its heading, and the trail pulses behind it.",
    bg:["#FFCB3D","#F5A70F"], period:2400, still:.7,
    body:`<g class="arrow"><path d="M512 196 L740 680 L512 572 L284 680 Z" fill="#1A2238" stroke="#1A2238" stroke-width="40" stroke-linejoin="round"/></g>
          <circle class="bc" data-i="0" data-o="1" cx="512" cy="740" r="30" fill="#1A2238"/>
          <circle class="bc" data-i="1" data-o=".55" cx="512" cy="822" r="22" fill="#1A2238"/>
          <circle class="bc" data-i="2" data-o=".3" cx="512" cy="888" r="15" fill="#1A2238"/>`,
    tick(svg, t) { const s = t / .55; const ang = s < 1 ? 70 * Math.exp(-4.2 * s) * Math.cos(11 * s) : 0;
      svg.querySelector(".arrow").setAttribute("transform", `rotate(${ang} 512 470)`);
      svg.querySelectorAll(".bc").forEach(d => { const i = +d.dataset.i; const w = clamp(1 - Math.abs((t - .55 - i * .1) / .12));
        d.setAttribute("opacity", (+d.dataset.o * (t < .5 ? .25 : .35 + .65 * Math.max(w, t > .9 ? 1 : 0))).toFixed(3)); }); } },
];

const grid = document.getElementById("grid");
const live = [];
for (const c of concepts) {
  const svg = cls => `<svg class="${cls}" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs><linearGradient id="g-${c.id}-${cls}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c.bg[0]}"/><stop offset="1" stop-color="${c.bg[1]}"/></linearGradient></defs>
      <rect width="1024" height="1024" fill="url(#g-${c.id}-${cls})"/>${c.body}</svg>`;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="row">${svg("big")}${svg("small")}</div><h2>${c.name}</h2><div class="idea">${c.idea}</div><p>${c.note}</p>`;
  grid.appendChild(card);
  card.querySelectorAll("svg").forEach(el => live.push({ c, el }));
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  for (const { c, el } of live) c.tick(el, reduce ? c.still : (now % c.period) / c.period);
  if (!reduce) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
