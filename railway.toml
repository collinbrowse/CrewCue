# Railway config-as-code for the CrewCue API (monorepo root = build context).
# Add a PostgreSQL service in Railway and link DATABASE_URL to this service.
# Docs: https://docs.railway.com/guides/config-as-code
#
# In the Railway service UI, leave "Root Directory" empty (repo root). If it is
# set to services/api, npm workspace flags fail pre-deploy with "No workspaces found".

[build]
builder = "RAILPACK"
# Railpack already runs `npm ci` in the install phase; a second `npm ci` here can fail with EBUSY on workspace caches (e.g. apps/web/node_modules/.vite).
buildCommand = "npm run build -w @crewcue/contracts && npm run build -w @crewcue/map-core && npm run build -w @crewcue/api"

[deploy]
preDeployCommand = ["npm run db:migrate"]
startCommand = "npm run start -w @crewcue/api"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
