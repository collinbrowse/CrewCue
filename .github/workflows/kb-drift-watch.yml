name: Knowledge base drift watch

# PRs do not commit docs/kb/generated; kb-refresh.yml regenerates it after each merge. This is the
# alarm for that loop silently stopping (missing credentials or bot token, a refresh PR whose CI
# never runs, auto-merge off). Daily, it runs kb:check on main. Stale with a refresh PR opened in
# the last 24 hours is normal lag. Stale with none, or with an older one, opens or updates an issue.

on:
  schedule:
    - cron: "0 8 * * *" # Daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check the knowledge base on main
        id: check
        run: |
          if node scripts/kb/generate-kb.mjs --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Allow a fresh refresh PR
        id: lag
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created="$(gh pr list --repo "$GITHUB_REPOSITORY" --head kb/refresh --state open --json createdAt --jq '.[0].createdAt')"
          if [ -n "$created" ] && [ $(( $(date +%s) - $(date -d "$created" +%s) )) -lt 86400 ]; then
            echo "::notice::KB is stale, but a refresh PR opened at $created is in flight."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update a tracking issue
        if: steps.check.outputs.stale == 'true' && steps.lag.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Knowledge base on main is stale"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still stale: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "docs/kb/generated on main does not match the code, and no kb/refresh PR has been open for less than 24 hours: $RUN_URL. Check the latest Knowledge base refresh run, whether KB_BOT_TOKEN is set (refresh PRs opened with GITHUB_TOKEN get no CI), and whether its PR is stuck. To fix by hand: run the refresh workflow, or open a PR with \`npm run kb:generate\`."
          fi
          exit 1
