name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Detect AWS credentials for Terraform
        id: aws_creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "terraform=true" >> "${GITHUB_OUTPUT}"
          else
            echo "terraform=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Staging Terraform skipped (no AWS credentials)
        if: steps.aws_creds.outputs.terraform != 'true'
        run: |
          echo "::notice title=Staging deploy::Terraform skipped — add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to the **staging** GitHub Environment (Repository Settings → Environments → staging → Environment secrets). Default AWS region for the provider is us-east-1 (see infra/terraform/environments/staging/variables.tf)."
      - name: Terraform Init/Plan (staging)
        if: steps.aws_creds.outputs.terraform == 'true'
        working-directory: infra/terraform/environments/staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init
          terraform plan -out=tfplan
      - name: Terraform Apply (manual approval should gate in environment settings)
        if: steps.aws_creds.outputs.terraform == 'true'
        working-directory: infra/terraform/environments/staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform apply -auto-approve tfplan
