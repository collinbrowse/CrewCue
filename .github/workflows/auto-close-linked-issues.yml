name: Auto Close Linked Issues

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues from PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Matches close/fix/resolve keywords followed by #<issue_number>.
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const matches = [...body.matchAll(regex)];
            const issueNumbers = [...new Set(matches.map((m) => Number(m[1])))];

            if (issueNumbers.length === 0) {
              core.info("No linked issues found in PR body.");
              return;
            }

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: "closed"
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `Automatically closed by merged PR #${context.payload.pull_request.number}.`
                });

                core.info(`Closed issue #${issueNumber}`);
              } catch (error) {
                core.warning(`Failed to close issue #${issueNumber}: ${error.message}`);
              }
            }
