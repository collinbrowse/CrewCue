name: Release

# Push a vX.Y.Z tag (npm run release -- X.Y.Z) to deploy the production API, build both apps,
# upload to TestFlight and Google Play internal testing, and publish a GitHub release.
# Secrets: docs/runbooks/mobile-release.md.
#
# Human gate: only a repo admin can create v* tags (tag ruleset), and every job here uses the
# `release` environment, which needs the owner's approval and only accepts v* tags. Agents can
# merge to main (staging) but never reach this workflow. See docs/runbooks/launch-owner-setup.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (vX.Y.Z)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.3.2-release/android-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_CHECKSUM: 939e933549d12d28f2e0bf71019d734d309859e9773c572657ce565a81f85d68

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          # Monotonic across releases; used as the iOS build number and the Android versionCode.
          echo "build=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
      - name: Check release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          missing=()
          for key in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON RAILWAY_TOKEN; do
            [ -z "${!key}" ] && missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing release secrets::Add to the 'release' environment: ${missing[*]} (see docs/runbooks/mobile-release.md)"
            exit 1
          fi
      - name: Check release build config
        env:
          CREWCUE_API_BASE_URL: ${{ vars.CREWCUE_API_BASE_URL }}
          CREWCUE_AUTH0_DOMAIN: ${{ vars.CREWCUE_AUTH0_DOMAIN }}
          CREWCUE_AUTH0_CLIENT_ID: ${{ vars.CREWCUE_AUTH0_CLIENT_ID }}
          CREWCUE_AUTH0_AUDIENCE: ${{ vars.CREWCUE_AUTH0_AUDIENCE }}
        run: |
          missing=()
          for key in CREWCUE_API_BASE_URL CREWCUE_AUTH0_DOMAIN CREWCUE_AUTH0_CLIENT_ID CREWCUE_AUTH0_AUDIENCE; do
            [ -z "${!key}" ] && missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing release variables::Add to the 'release' environment variables: ${missing[*]} (see docs/runbooks/mobile-release.md)"
            exit 1
          fi
          host="${CREWCUE_API_BASE_URL#https://}"; host="${host%%/*}"; host="${host%%:*}"
          if [[ "$CREWCUE_API_BASE_URL" != https://* ]] || [[ " localhost 127.0.0.1 10.0.2.2 0.0.0.0 " == *" $host "* ]]; then
            echo "::error title=Bad release API URL::CREWCUE_API_BASE_URL must be an https server address, got $CREWCUE_API_BASE_URL"
            exit 1
          fi

  # The production API ships first so the new app builds never talk to an older server.
  # Railway production does not deploy from main; it deploys only from here.
  api-production:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli@5.71.0 --foreground-scripts
          railway up --ci --service "${{ vars.RAILWAY_PRODUCTION_SERVICE || 'CrewCue' }}" --environment production --message "${{ needs.preflight.outputs.tag }}"
      - name: Check production health
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS "${{ vars.CREWCUE_API_BASE_URL }}/health/live" && exit 0
            sleep 10
          done
          echo "::error::Production API is not healthy after deploy. Roll back in Railway (docs/runbooks/staging-deploy.md)."
          exit 1

  ios:
    needs: [preflight, api-production]
    runs-on: macos-latest
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project apps/ios/CrewCue.xcodeproj -scheme CrewCue -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/CrewCue.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CREWCUE_API_BASE_URL="${{ vars.CREWCUE_API_BASE_URL }}" \
            CREWCUE_AUTH0_DOMAIN="${{ vars.CREWCUE_AUTH0_DOMAIN }}" \
            CREWCUE_AUTH0_CLIENT_ID="${{ vars.CREWCUE_AUTH0_CLIENT_ID }}" \
            CREWCUE_AUTH0_AUDIENCE="${{ vars.CREWCUE_AUTH0_AUDIENCE }}" \
            CREWCUE_SENTRY_DSN="${{ vars.SENTRY_DSN_IOS || secrets.SENTRY_DSN }}" \
            MARKETING_VERSION="${{ needs.preflight.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.preflight.outputs.build }}"
      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" apps/ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CrewCue.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-dsyms
          path: ${{ runner.temp }}/CrewCue.xcarchive/dSYMs
      # Symbolicates Sentry crash reports (ADR 0010). Skips when the owner has not added the
      # Sentry secret/vars to the release environment; a failed upload never fails the release.
      - name: Upload dSYMs to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_IOS }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning title=Sentry dSYMs skipped::Add secret SENTRY_AUTH_TOKEN and vars SENTRY_ORG, SENTRY_PROJECT_IOS to the release environment"
            exit 0
          fi
          npx --yes @sentry/cli@3.8.2 debug-files upload --include-sources "$RUNNER_TEMP/CrewCue.xcarchive/dSYMs"

  android:
    needs: [preflight, api-production]
    runs-on: ubuntu-24.04  # Swift 6.3 Linux toolchain needs libxml2.so.2, gone on 26.04
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-swift
        with:
          version: "6.3.2"
      - name: Install Swift Android SDK
        run: bash scripts/install-swift-android-sdk.sh
      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CREWCUE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CREWCUE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CREWCUE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SWIFT_BUILD_CONFIGURATION: release
        run: |
          export CREWCUE_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CREWCUE_ANDROID_KEYSTORE"
          ./apps/android/gradlew -p apps/android :app:bundleRelease \
            -Pcrewcue.release.apiBaseUrl="${{ vars.CREWCUE_API_BASE_URL }}" \
            -Pcrewcue.release.auth0Domain="${{ vars.CREWCUE_AUTH0_DOMAIN }}" \
            -Pcrewcue.release.auth0ClientId="${{ vars.CREWCUE_AUTH0_CLIENT_ID }}" \
            -Pcrewcue.release.auth0Audience="${{ vars.CREWCUE_AUTH0_AUDIENCE }}" \
            -Pcrewcue.versionName="${{ needs.preflight.outputs.version }}" \
            -Pcrewcue.versionCode="${{ needs.preflight.outputs.build }}"
      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.crewcue.android
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab

  github-release:
    needs: [preflight, api-production, ios, android]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: release-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          aab=$(find release-artifacts -name app-release.aab -print -quit)
          if [ -z "$aab" ]; then
            echo "::error::app-release.aab was not in the android-aab artifact"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$aab" --clobber
          else
            gh release create "$TAG" "$aab" --title "$TAG" --generate-notes --verify-tag
          fi
