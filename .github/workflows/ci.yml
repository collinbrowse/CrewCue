name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.3.2-release/android-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_CHECKSUM: 939e933549d12d28f2e0bf71019d734d309859e9773c572657ce565a81f85d68

jobs:
  pr-decision-doc-guard:
    # Dependabot writes its own PR body and rewrites it on every rebase, so it can't carry the
    # template. Skipping here (not failing) lets `checks` run on dependency bumps.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
      - name: Validate PR decision documentation sections
        run: node scripts/pr-decision-doc-guard.mjs --body-file "$RUNNER_TEMP/pr-body.md"

  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/client-core/**'
              - 'clients/behavior/**'
              - '.github/workflows/ci.yml'
            ios:
              - *shared
              - 'apps/ios/**'
              - 'scripts/test-ios.mjs'
            android:
              - *shared
              - 'apps/android/**'
              - 'scripts/build-swift-android.mjs'
              - 'scripts/install-swift-android-sdk.sh'
              - 'scripts/lib/swiftAndroidToolchain.mjs'
              - '.github/actions/setup-swift/**'

  # Name kept for branch protection. Guards the native client boundaries and behavior checklists.
  dual-client-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:clients

  checks:
    if: >-
      always()
      && needs.dual-client-guard.result == 'success'
      && (needs.pr-decision-doc-guard.result == 'success' || needs.pr-decision-doc-guard.result == 'skipped')
    needs: [pr-decision-doc-guard, dual-client-guard]
    runs-on: ubuntu-24.04  # Swift 6.3 Linux toolchain needs libxml2.so.2, gone on 26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run agent:harness:test
      - uses: ./.github/actions/setup-swift
        with:
          version: "6.3.2"
      - run: npm run verify:client-core

  api-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crewcue_test
          POSTGRES_USER: crewcue
          POSTGRES_PASSWORD: crewcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewcue -d crewcue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crewcue:crewcue@localhost:5432/crewcue_test
      PERSISTENCE_MODE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @crewcue/api
      - run: npm run db:migrate -w @crewcue/api
      - run: npm run test:pg -w @crewcue/api

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and run UI smoke tests
        run: node scripts/test-ios.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: .agent-pr-evidence/*.xcresult

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04  # Swift 6.3 Linux toolchain needs libxml2.so.2, gone on 26.04
    timeout-minutes: 60
    env:
      CREWCUE_REQUIRE_ANDROID_SWIFT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-swift
        with:
          version: "6.3.2"
      - name: Install Swift Android SDK
        run: bash scripts/install-swift-android-sdk.sh
      - name: Cross-compile client-core with tests (arm64)
        run: node scripts/verify-client-core-android-build.mjs
      - name: Build debug and test APKs
        run: ./apps/android/gradlew -p apps/android :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run deeplink smoke tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./apps/android/gradlew -p apps/android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-results
          path: apps/android/app/build/reports/androidTests
