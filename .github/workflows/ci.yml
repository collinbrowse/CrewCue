name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly: every job on main, whatever changed. Catches a break the path rules missed.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. On main nothing is cancelled: the running
# commit finishes, and of the commits that land meanwhile only the newest runs next.
concurrency:
  # The nightly and manual runs get their own group, so a push cannot take their place in line.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

env:
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.3.2-release/android-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_CHECKSUM: 939e933549d12d28f2e0bf71019d734d309859e9773c572657ce565a81f85d68

jobs:
  pr-decision-doc-guard:
    # Dependabot writes its own PR body and rewrites it on every rebase, so it can't carry the
    # template. Skipping here (not failing) lets `checks` run on dependency bumps.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
      - name: Validate PR decision documentation sections
        run: node scripts/pr-decision-doc-guard.mjs --body-file "$RUNNER_TEMP/pr-body.md"

  # Decides whether the device jobs need to run (scripts/ci-changed-areas.mjs). On a PR the base is
  # the target branch. On main it is the commit of the last green CI run, so a change whose own run
  # failed, was cancelled or never started is still tested by the next run. The nightly run and
  # manual runs have no base and run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.areas.outputs.ios }}
      android: ${{ steps.areas.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # The checkout is the PR merged into its target; the first parent is the target's tip.
              base="$(git rev-parse HEAD^1 || true)" ;;
            push)
              base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
              git cat-file -e "$base^{commit}" 2>/dev/null || base="" ;;
          esac
          node scripts/ci-changed-areas.mjs --base "$base"

  # Name kept for branch protection. Guards the native client boundaries and behavior checklists.
  dual-client-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:clients

  checks:
    if: >-
      always()
      && needs.dual-client-guard.result == 'success'
      && (needs.pr-decision-doc-guard.result == 'success' || needs.pr-decision-doc-guard.result == 'skipped')
    needs: [pr-decision-doc-guard, dual-client-guard]
    runs-on: ubuntu-24.04  # Swift 6.3 Linux toolchain needs libxml2.so.2, gone on 26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run agent:harness:test
      - uses: ./.github/actions/setup-swift
        with:
          version: "6.3.2"
      - run: npm run verify:client-core

  # Informational only: PRs do not commit docs/kb/generated. kb-refresh.yml regenerates it once
  # a day. This job shows how the PR moves the KB (new routes, unguarded routes, tables, env vars)
  # in the job summary so a reviewer still sees it, and never fails.
  kb-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Show how this PR changes the generated KB
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          touched="$(git diff --name-only "origin/$BASE_REF...HEAD" -- docs/kb/generated || true)"
          if [ -n "$touched" ] && [ "$HEAD_REF" != "kb/refresh" ]; then
            echo "::warning::This PR edits docs/kb/generated. kb-refresh regenerates it once a day; drop these changes to avoid conflicts with other PRs."
          fi
          # Compare with line numbers stripped, so code that only moved shows nothing.
          norm() { sed -E 's/(:|#L)[0-9]+//g' "$1"; }
          before="$RUNNER_TEMP/kb-before"; mkdir -p "$before"
          cp docs/kb/generated/*.md "$before/"
          node scripts/kb/generate-kb.mjs
          changes=""
          for f in docs/kb/generated/*.md; do
            d="$(diff -U0 <(norm "$before/$(basename "$f")") <(norm "$f") | grep -E '^[-+][^-+]' || true)"
            [ -n "$d" ] && changes="$changes"$'\n'"### $(basename "$f")"$'\n```diff\n'"$d"$'\n```'
          done
          {
            echo "## Knowledge base drift"
            if [ -z "$changes" ]; then
              echo "No change to the generated KB."
            else
              echo "kb-refresh updates these pages once a day. Check risk-signals.md for new unguarded routes."
              printf '%s\n' "$changes" | head -300
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  api-postgres-integration:
    runs-on: ubuntu-latest
    # About 3 minutes. It was 12 when each test file waited 10 s on idle connections before exiting
    # (see allowExitOnIdle in roomPersistence.ts); the limit catches that coming back.
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crewcue_test
          POSTGRES_USER: crewcue
          POSTGRES_PASSWORD: crewcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewcue -d crewcue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crewcue:crewcue@localhost:5432/crewcue_test
      PERSISTENCE_MODE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @crewcue/api
      - run: npm run db:migrate -w @crewcue/api
      - run: npm run test:pg -w @crewcue/api

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and run UI smoke tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-ios.mjs 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
      # test-ios.mjs retries a failed test in CI. A test that needed a retry is flaky: name it here
      # so it is still seen when the job passes.
      - name: List tests that failed at least once
        if: always()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/ios-tests.log" ] || exit 0
          # grep exits 1 when nothing failed, which is the normal case.
          { grep -oE "Test Case '-\[[^]]+\]' failed" "$RUNNER_TEMP/ios-tests.log" || true; } | sed -E "s/Test Case '-\[(.*)\]' failed/\1/" | sort | uniq -c | while read -r count name; do
            echo "::warning title=iOS test failed an attempt::$name failed $count of up to 3 attempts"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-test-results
          path: .agent-pr-evidence/*.xcresult

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04  # Swift 6.3 Linux toolchain needs libxml2.so.2, gone on 26.04
    timeout-minutes: 60
    env:
      CREWCUE_REQUIRE_ANDROID_SWIFT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-swift
        with:
          version: "6.3.2"
      - name: Install Swift Android SDK
        run: bash scripts/install-swift-android-sdk.sh
      - name: Cross-compile client-core with tests (arm64)
        run: node scripts/verify-client-core-android-build.mjs
      - name: Build debug and test APKs, run JVM unit tests
        run: ./apps/android/gradlew -p apps/android :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run deeplink smoke tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # One retry: a slow hosted emulator sometimes misses a 15-second Compose wait. The warning
          # keeps the first failure visible when the retry passes.
          script: ./apps/android/gradlew -p apps/android :app:connectedDebugAndroidTest || { echo "::warning title=Flaky Android smoke tests::First attempt failed, retrying once"; ./apps/android/gradlew -p apps/android :app:connectedDebugAndroidTest; }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-results
          path: apps/android/app/build/reports/androidTests
