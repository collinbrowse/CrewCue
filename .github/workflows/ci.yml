name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-decision-doc-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR decision documentation sections
        uses: actions/github-script@v7
        with:
          script: |
            // Prefer REST `pulls.get` (full body); fall back to webhook payload if token cannot read pulls.
            const prNumber = context.payload.pull_request.number;
            let body = "";
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              body = pr.body ?? "";
            } catch (e) {
              core.warning(`pulls.get failed (${e.message}); using pull_request payload body`);
              body = context.payload.pull_request?.body ?? "";
            }
            body = body.replace(/\uFEFF/g, "").replace(/\u00A0/g, " ");
            // Normalize dash lookalikes so "## Higher-Order ..." matches after copy/paste from docs
            body = body.replace(/\u2011|\u2013|\u2014/g, "-");

            const requiredHeaders = [
              "## Decision Tree and Rationale",
              "## Implicit Assumptions and Invariants",
              "## Higher-Order Effects Check"
            ];

            const missingHeaders = requiredHeaders.filter((header) => !body.includes(header));
            if (missingHeaders.length > 0) {
              const payloadLen = (context.payload.pull_request?.body ?? "").length;
              core.setFailed(
                `PR body missing required section headers: ${missingHeaders.join(", ")} (API body length ${body.length}, payload body length ${payloadLen})`
              );
              return;
            }

            // Allow optional Markdown bold: "- Decision: ..." or "- **Decision:** ..." (colon may sit inside **...**)
            const mdLabel = (word) =>
              new RegExp(
                `-\\s*\\*{0,2}${word}:\\*{0,2}\\s+\\S`,
                "i"
              );
            const hasDecisionContent =
              mdLabel("Decision").test(body) || /Single obvious path/i.test(body);
            if (!hasDecisionContent) {
              core.setFailed(
                "Decision Tree and Rationale must include at least one filled '- Decision: ...' (or **Decision**) line or explicit 'Single obvious path'."
              );
              return;
            }

            const hasAssumptionContent =
              mdLabel("Assumption").test(body) || /None identified/i.test(body);
            if (!hasAssumptionContent) {
              core.setFailed(
                "Implicit Assumptions and Invariants must include at least one filled '- Assumption: ...' (or **Assumption**) line or explicit 'None identified'."
              );
              return;
            }

            const hasEffectsSummary =
              mdLabel("Summary").test(body) || /None identified/i.test(body);
            if (!hasEffectsSummary) {
              core.setFailed(
                "Higher-Order Effects Check must include a filled '- Summary: ...' (or **Summary**) line or explicit 'None identified'."
              );
              return;
            }

            core.info("PR decision documentation guard passed.");
  dual-client-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run verify:dual-client
  checks:
    needs: [pr-decision-doc-guard, dual-client-guard]
    runs-on: ubuntu-latest
    env:
      # CI has no local `apps/mobile/.env`; Expo inlines these at bundle time.
      # Placeholders keep `expo export` deterministic and catch Metro/resolver regressions.
      EXPO_PUBLIC_AUTH0_DOMAIN: ci-placeholder.invalid
      EXPO_PUBLIC_AUTH0_CLIENT_ID: ci-placeholder-client
      EXPO_PUBLIC_AUTH0_AUDIENCE: https://ci-placeholder-api
      EXPO_PUBLIC_AUTH0_CONNECTION_GOOGLE: ci-placeholder-google-oauth2
      EXPO_PUBLIC_AUTH0_CONNECTION_APPLE: ci-placeholder-apple
      EXPO_PUBLIC_AUTH0_CONNECTION_EMAIL: ci-placeholder-email-db
      EXPO_PUBLIC_API_BASE_URL: https://ci-placeholder.invalid
      EXPO_PUBLIC_MAPTILER_API_KEY: ci-placeholder-maptiler
      EXPO_PUBLIC_STREAM_API_KEY: ci-placeholder-stream
      VITE_MAPTILER_API_KEY: ci-placeholder-maptiler
      MAPTILER_API_KEY: ci-placeholder-maptiler
      VITE_API_BASE_URL: https://ci-placeholder.invalid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run smoke:mobile:startup
      - run: npm run build
      # Runs workspace tests: @crewcue/contracts (tsx), @crewcue/mobile (tsx), @crewcue/api (node:test + build).
      - run: npm run test
  api-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crewcue_test
          POSTGRES_USER: crewcue
          POSTGRES_PASSWORD: crewcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewcue -d crewcue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crewcue:crewcue@localhost:5432/crewcue_test
      PERSISTENCE_MODE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck -w @crewcue/api
      - run: npm run test:pg -w @crewcue/api
