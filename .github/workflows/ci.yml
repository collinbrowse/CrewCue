name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-decision-doc-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          echo "PR body length $(wc -c < "$RUNNER_TEMP/pr-body.md")"
      - name: Validate PR decision documentation sections
        run: node scripts/pr-decision-doc-guard.mjs --body-file "$RUNNER_TEMP/pr-body.md"
  dual-client-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run verify:dual-client
  checks:
    # On push to main, pr-decision-doc-guard is skipped; still run checks after dual-client-guard.
    if: >-
      always()
      && needs.dual-client-guard.result == 'success'
      && (needs.pr-decision-doc-guard.result == 'success'
          || needs.pr-decision-doc-guard.result == 'skipped')
    needs: [pr-decision-doc-guard, dual-client-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run verify:client-behavior
      - run: npm run verify:client-boundary
      - run: npm run verify:client-codegen
      - run: npm run verify:client-core
      - run: npm run agent:harness:test
  api-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crewcue_test
          POSTGRES_USER: crewcue
          POSTGRES_PASSWORD: crewcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewcue -d crewcue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crewcue:crewcue@localhost:5432/crewcue_test
      PERSISTENCE_MODE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck -w @crewcue/api
      - run: npm run build -w @crewcue/contracts && npm run build -w @crewcue/map-core && npm run build -w @crewcue/platform-client
      - run: npm run db:migrate -w @crewcue/api
      - run: npm run test:pg -w @crewcue/api
  client-core-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.2"
      - name: Install Swift Android SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.3.2-release/android-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_android.artifactbundle.tar.gz --checksum 939e933549d12d28f2e0bf71019d734d309859e9773c572657ce565a81f85d68
      - name: Cross-compile client-core
        env:
          CREWCUE_REQUIRE_ANDROID_SWIFT: "1"
        run: node scripts/verify-client-core-android-build.mjs
