name: Knowledge base refresh

# Keeps docs/kb in step with main. The generated pages are rebuilt by script; the narrative
# pages (architecture, data flow, risks) are reconciled by Claude against the diff since the
# last refresh. The result lands as a PR that touches only docs/kb/** and auto-merges once CI
# is green. Needs the ANTHROPIC_API_KEY secret; without it the job reports and exits cleanly.
# Optional KB_BOT_TOKEN (the agent bot's PAT): PRs opened with the default GITHUB_TOKEN do not
# trigger CI, so required checks would never run on the refresh PR.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/**"
      - "apps/**"
      - "clients/behavior/**"
      - "docs/adr/**"
      - "docs/release/**"
      - "railway.toml"
      - ".github/workflows/**"
      - "scripts/kb/**"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, catches anything the path filter missed
  workflow_dispatch:

concurrency:
  group: kb-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      BRANCH: kb/refresh
    steps:
      - name: Skip without API key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set; knowledge base narrative refresh skipped."

      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.KB_BOT_TOKEN || github.token }}

      - name: Skip if nothing changed since the last refresh
        if: env.HAS_KEY == 'true'
        id: since
        run: |
          last="$(cat docs/kb/.refresh-sha 2>/dev/null || true)"
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$last"..HEAD -- . ':(exclude)docs/kb')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No code changes since $last."
          fi

      - uses: actions/setup-node@v7
        if: env.HAS_KEY == 'true' && steps.since.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Regenerate fact pages
        if: env.HAS_KEY == 'true' && steps.since.outputs.skip != 'true'
        run: node scripts/kb/generate-kb.mjs

      - name: Reconcile narrative pages
        if: env.HAS_KEY == 'true' && steps.since.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Follow scripts/kb/refresh-prompt.md exactly. HEAD is ${{ github.sha }}.
            Write your closing summary (five lines at most) to kb-summary.md in the repository root.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*),Bash(cat:*)"

      - name: Refuse changes outside docs/kb
        if: env.HAS_KEY == 'true' && steps.since.outputs.skip != 'true'
        run: |
          mv kb-summary.md "$RUNNER_TEMP/kb-summary.md" 2>/dev/null || echo "Narrative refresh." > "$RUNNER_TEMP/kb-summary.md"
          outside="$(git status --porcelain | awk '{print $2}' | grep -v '^docs/kb/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::Refresh touched files outside docs/kb:"; echo "$outside"; exit 1
          fi

      - name: Open or update the refresh PR
        if: env.HAS_KEY == 'true' && steps.since.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.KB_BOT_TOKEN || github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/kb)" ]; then echo "Knowledge base already current."; exit 0; fi
          git config user.name "crewcue-kb[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/kb
          git commit -m "docs(kb): reconcile knowledge base with ${GITHUB_SHA::7}"
          git push --force origin "$BRANCH"

          body="$RUNNER_TEMP/body.md"
          {
            echo "## Scope"; echo
            echo "Automated knowledge base refresh against \`${GITHUB_SHA::7}\`. Touches only \`docs/kb/**\`."; echo
            cat "$RUNNER_TEMP/kb-summary.md"; echo
            echo "No issue: automated documentation refresh."; echo
            echo "## Decision Tree and Rationale"; echo
            echo "- Decision: Single obvious path"; echo
            echo "## Implicit Assumptions and Invariants"; echo
            echo "- Assumption: generated pages come from scripts/kb/generate-kb.mjs; narrative claims cite files"; echo
            echo "## Higher-Order Effects Check"; echo
            echo "- Summary: None identified (documentation only)"; echo
            echo "## Test plan"; echo
            echo "- [x] \`npm run kb:check\` runs in CI"; echo
            echo "## Risk and rollback"; echo
            echo "- Risk: low"; echo "- Rollback: revert the PR"; echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$body"

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "docs(kb): knowledge base refresh" --body-file "$body"
          fi
          gh pr merge "$BRANCH" --squash --auto || echo "::notice::Auto-merge not enabled; merge the refresh PR by hand."
