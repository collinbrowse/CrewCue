name: Knowledge base refresh

# Keeps docs/kb in step with main, once a day. The generated pages are rebuilt by script; the
# narrative pages (architecture, data flow, risks) are reconciled by Claude against the diff since
# the last refresh. The result lands as a PR that touches only docs/kb/** and auto-merges once CI
# is green.
#
# Once a day, not on every push: a refresh after each merge was 44 of 100 merged PRs, and each one
# moved main under every open PR. To refresh sooner, run this workflow by hand. PRs do not commit docs/kb/generated, so this is the only writer of those pages: the
# script-only regeneration runs on every trigger, credentials or not. The narrative step signs in
# with CLAUDE_CODE_OAUTH_TOKEN (a Claude subscription, from `claude setup-token`) when set, else
# ANTHROPIC_API_KEY (API credits); with neither, only the fact pages are refreshed.
# Optional KB_BOT_TOKEN (the agent bot's PAT): PRs opened with the default GITHUB_TOKEN do not
# trigger CI, so required checks would never run on the refresh PR.

on:
  schedule:
    - cron: "0 7 * * *" # Daily 07:00 UTC; skips itself when no code changed since the last refresh
  workflow_dispatch:

concurrency:
  group: kb-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      BRANCH: kb/refresh
    steps:
      - name: Note missing Claude credentials
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set; fact pages only, narrative refresh skipped."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.KB_BOT_TOKEN || github.token }}

      - name: Skip if nothing changed since the last refresh
        id: since
        run: |
          last="$(cat docs/kb/.refresh-sha 2>/dev/null || true)"
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$last"..HEAD -- . ':(exclude)docs/kb')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No code changes since $last."
          fi

      - uses: actions/setup-node@v7
        if: steps.since.outputs.skip != 'true'
        with:
          node-version: 22 # the Claude Code CLI requires Node >= 22

      - name: Regenerate fact pages
        if: steps.since.outputs.skip != 'true'
        run: node scripts/kb/generate-kb.mjs

      # The Claude Code CLI directly, not claude-code-action: the CLI runs on any trigger.
      - name: Reconcile narrative pages
        if: env.HAS_KEY == 'true' && steps.since.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An API key outranks the subscription token, so drop it when the token is set.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; fi
          npm install --global @anthropic-ai/claude-code@2.1.321
          claude -p "Follow scripts/kb/refresh-prompt.md exactly. HEAD is ${GITHUB_SHA}. Write your closing summary (five lines at most) to kb-summary.md in the repository root." \
            --max-budget-usd 5 \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*),Bash(cat:*)"

      - name: Refuse changes outside docs/kb
        if: steps.since.outputs.skip != 'true'
        run: |
          if [ "$HAS_KEY" = "true" ]; then fallback="Narrative refresh."; else fallback="Fact pages regenerated. Narrative pages not refreshed (no Claude credentials)."; fi
          mv kb-summary.md "$RUNNER_TEMP/kb-summary.md" 2>/dev/null || echo "$fallback" > "$RUNNER_TEMP/kb-summary.md"
          outside="$(git status --porcelain | awk '{print $2}' | grep -v '^docs/kb/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::Refresh touched files outside docs/kb:"; echo "$outside"; exit 1
          fi

      - name: Open or update the refresh PR
        if: steps.since.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.KB_BOT_TOKEN || github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/kb)" ]; then echo "Knowledge base already current."; exit 0; fi
          git config user.name "crewcue-kb[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/kb
          git commit -m "docs(kb): reconcile knowledge base with ${GITHUB_SHA::7}"
          git push --force origin "$BRANCH"

          body="$RUNNER_TEMP/body.md"
          {
            echo "## Scope"; echo
            echo "Automated knowledge base refresh against \`${GITHUB_SHA::7}\`. Touches only \`docs/kb/**\`."; echo
            cat "$RUNNER_TEMP/kb-summary.md"; echo
            echo "No issue: automated documentation refresh."; echo
            echo "## Decision Tree and Rationale"; echo
            echo "- Decision: Single obvious path"; echo
            echo "## Implicit Assumptions and Invariants"; echo
            echo "- Assumption: generated pages come from scripts/kb/generate-kb.mjs; narrative claims cite files"; echo
            echo "## Higher-Order Effects Check"; echo
            echo "- Summary: None identified (documentation only)"; echo
            echo "## Test plan"; echo
            echo "- [x] Generated by \`npm run kb:generate\` on \`${GITHUB_SHA::7}\`"; echo
            echo "## Risk and rollback"; echo
            echo "- Risk: low"; echo "- Rollback: revert the PR"; echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$body"

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "docs(kb): knowledge base refresh" --body-file "$body"
          fi
          gh pr merge "$BRANCH" --squash --auto || echo "::notice::Auto-merge not enabled; merge the refresh PR by hand."
