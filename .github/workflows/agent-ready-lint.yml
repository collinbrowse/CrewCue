name: Agent Ready lint

on:
  issues:
    types: [labeled, edited, opened]

permissions:
  issues: write
  contents: read

jobs:
  ready-lint:
    if: contains(join(github.event.issue.labels.*.name, ','), 'agent-ready')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md

      - name: Run Ready gate
        id: ready
        continue-on-error: true
        run: |
          set +e
          OUT=$(node scripts/agent-issue-ready.mjs --body-file /tmp/issue-body.md 2>&1)
          CODE=$?
          {
            echo "code=$CODE"
            echo "out<<EOF"
            echo "$OUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment when not Ready
        if: steps.ready.outputs.code != '0'
        uses: actions/github-script@v7
        env:
          READY_OUT: ${{ steps.ready.outputs.out }}
        with:
          script: |
            const marker = "<!-- agent-ready-lint -->";
            const readyOut = process.env.READY_OUT || "FAIL: not Ready";
            const text = `${marker}\n\`\`\`\n${readyOut}\n\`\`\`\n\nFix Ready fields (or remove \`agent-ready\`) before agents implement. Run locally: \`npm run agent:issue:ready -- ${{ github.event.issue.number }}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              per_page: 50
            });
            const existing = comments.find((c) => (c.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: text
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: text
              });
            }
            core.setFailed("Issue labeled agent-ready but Ready gate failed");
