name: Staging Automation Smoke

on:
  schedule:
    - cron: "0 5 * * *" # Daily 05:00 UTC, so the 06:00 bug hunt can pick up a failure
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-staging-smoke'
    runs-on: ubuntu-latest
    environment: staging-automation
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ secrets.STAGING_AUTOMATION_API_BASE_URL }}
      AUTH0_ISSUER: ${{ secrets.AUTH0_ISSUER }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      AUTH0_AUTOMATION_CLIENT_ID: ${{ secrets.AUTH0_AUTOMATION_CLIENT_ID }}
      AUTH0_AUTOMATION_CLIENT_SECRET: ${{ secrets.AUTH0_AUTOMATION_CLIENT_SECRET }}
      AUTH0_AUTOMATION_USER_EMAIL: ${{ secrets.AUTH0_AUTOMATION_USER_EMAIL }}
      AUTH0_AUTOMATION_USER_PASSWORD: ${{ secrets.AUTH0_AUTOMATION_USER_PASSWORD }}
      AUTH0_AUTOMATION_CONNECTION: ${{ secrets.AUTH0_AUTOMATION_CONNECTION }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate required env vars are present
        run: |
          set -euo pipefail
          for key in API_BASE_URL AUTH0_ISSUER AUTH0_AUDIENCE AUTH0_AUTOMATION_CLIENT_ID AUTH0_AUTOMATION_CLIENT_SECRET AUTH0_AUTOMATION_USER_EMAIL AUTH0_AUTOMATION_USER_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing secret::${key} is required in environment staging-automation"
              exit 1
            fi
          done

      - name: Ensure script is executable
        run: chmod +x ./scripts/staging-smoke-stoppage.sh

      - name: Run stoppage staging smoke
        run: ./scripts/staging-smoke-stoppage.sh

      - name: Post success summary
        if: success()
        run: |
          {
            echo "## Staging Smoke Result"
            echo "- Status: ✅ pass"
            echo "- Script: \`scripts/staging-smoke-stoppage.sh\`"
            echo "- Scope: WS2 stoppage manual stop + resolved source flows"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post failure summary
        if: failure()
        run: |
          {
            echo "## Staging Smoke Result"
            echo "- Status: ❌ fail"
            echo "- Script: \`scripts/staging-smoke-stoppage.sh\`"
            echo "- Next: inspect failed step logs (token is never printed)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled staging smoke is failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug \
              --body "The nightly staging smoke failed: $RUN_URL. The next bug hunt treats this as its first target."
          fi
