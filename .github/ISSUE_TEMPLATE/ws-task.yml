name: Workstream Task
description: Create a scoped implementation task for one workstream.
title: "[WSx] "
labels: ["workstream-task"]
body:
  - type: input
    id: workstream
    attributes:
      label: Workstream
      description: Which workstream does this task belong to?
      placeholder: WS1
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this task deliver?
      placeholder: Implement invite acceptance flow for race room participants.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In-Scope Changes
      description: List concrete behaviors to implement.
      placeholder: "- add endpoint\n- update UI state\n- persist event"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Copy the exact criteria from the workstream plan.
      placeholder: "- unauthorized users cannot access room data"
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Explicitly list what this task will not include.
      placeholder: "- billing integration details\n- admin analytics"

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Add the checks required before merge.
      value: |
        - npm run lint
        - npm run typecheck
        - npm run build
        - npm run test
    validations:
      required: true
